<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ha Koo Soong Wai</title>
<meta name="description" content="A working prototype of a senior-to-senior health network: older adults trained and certified by community health professionals, then supporting other older adults as peer health mentors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%239B1B3A'/%3E%3Cpath d='M24 37.5s-11-6.6-11-14a6.1 6.1 0 0 1 11-3.4 6.1 6.1 0 0 1 11 3.4c0 7.4-11 14-11 14z' fill='%23fff'/%3E%3C/svg%3E">
<!--CSS-->
</head>
<body>

<main class="stage">

  <!-- Left: the system panel. The five stages light up with the app, and the
       counters move as the demo is used. -->
  <aside class="rail" id="rail" aria-label="How the network works"></aside>

  <!-- Right: the app itself. -->
  <div class="stage__phone-area">
    <div class="phone">
      <div class="phone__screen">

        <div class="statusbar">
          <span class="tnum">9:41</span>
          <span class="statusbar__notch"></span>
          <span class="statusbar__right">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
              <path d="M1 7.4 4.4 4l3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
              <path d="M6.2 7.4 9.6 4l3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
              <path d="M11.4 7.4 14.8 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
              <path d="M1 4.6a9.4 9.4 0 0 1 14 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
              <path d="M3.6 7.2a5.8 5.8 0 0 1 8.8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
              <circle cx="8" cy="10" r="1.3" fill="currentColor"/>
            </svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
              <rect x=".6" y=".6" width="21" height="10.8" rx="3.2" stroke="currentColor" stroke-width="1.1" opacity=".45"/>
              <rect x="2.3" y="2.3" width="15" height="7.4" rx="1.9" fill="currentColor"/>
              <path d="M23.2 4.3v3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".45"/>
            </svg>
          </span>
        </div>

        <div class="app">
          <header class="appbar" id="appbar"></header>
          <section class="view" id="view" aria-live="polite"></section>
          <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
        </div>

        <div id="toast-host"></div>
        <div id="sheet-host"></div>

      </div>
    </div>
  </div>

</main>

<noscript>
  <p style="padding:24px;font:16px system-ui">This prototype needs JavaScript to run.</p>
</noscript>

<!--JS-->
</body>
</html>
