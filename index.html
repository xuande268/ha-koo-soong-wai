/* ==========================================================================
   Ha Koo Soong Wai — Senior-to-Senior Health Network
   Design system. The senior-mentor side of the Ha Koo Soong Wai platform.

   The layout grammar is taken from the app 1 mockup: a brand header over a
   greeting stack, a hero card with a favourite button and pagination dots, a
   centred detail header, a centred profile block, and the blush / confirmation
   / map / checklist components — white cards on a white page, held apart by
   shadow rather than by a grey ground.

   One deliberate deviation: the mockup sets body text at 14-16px. Older adults
   are reading this, so the base stays 17px and every target stays 44px. The
   type *ratios* follow the mockup; the absolute sizes are tuned up.
   ========================================================================== */

/* --- tokens ------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* brand */
  --maroon-900: #6B0F27;
  --maroon-800: #86132F;
  --maroon-700: #9E1B3C;   /* primary, sampled from the mockup */
  --maroon-600: #B22446;
  --maroon-500: #C93A60;
  --maroon-200: #EDC6D2;
  --maroon-100: #F7DDE5;
  --blush-50:  #FDF1F4;
  --blush-100: #FBE4EA;    /* the "you earn" card */

  /* ink — muted steps set by contrast against white, not by eye */
  --ink-900: #1C1C1E;
  --ink-800: #2C2C2E;
  --ink-700: #3C3C43;
  --ink-600: #48484A;
  --ink-500: #5A5A5F;      /* secondary text */
  --ink-400: #6E6E73;      /* muted, still clears 4.5:1 */
  --ink-300: #8E8E93;      /* decoration only */

  /* surfaces */
  --paper:  #FFFFFF;
  --canvas: #FFFFFF;
  --chip:   #EFEFF1;
  --line: #E8E8EA;
  --line-soft: #F2F2F4;

  /* status — always paired with an icon, never colour alone */
  --good-700: #15683B;   /* 5.9:1 on good-100 */
  --good-500: #177A45;   /* 5.4:1 with white, for the confirmed badge */
  --good-100: #DFF3E6;
  --good-50:  #EAF7EF;
  --banner:   #E8F5EC;

  --warn-700: #7E5405;
  --warn-500: #9A6608;
  --warn-100: #F8E4BE;
  --warn-50:  #FDF6E8;

  --crit-700: #96221A;
  --crit-500: #B32A20;
  --crit-100: #F7D8D4;
  --crit-50:  #FDF1EF;

  --info-700: #17518F;
  --info-500: #1D5FA8;
  --info-100: #D9E7F8;
  --info-50:  #EFF5FD;

  /* triage gradients — endpoints are tokens so the contrast check reads them */
  --triage-good-a: #0F6B41;  --triage-good-b: #157A48;
  --triage-warn-a: #7E5405;  --triage-warn-b: #9C6B0B;
  --triage-crit-a: #96221A;  --triage-crit-b: #BE3527;

  /* data viz — a single series takes the brand hue */
  --series-1: #9E1B3C;
  --series-2: #1D5FA8;
  --grid: #E8E8EA;
  --axis: #C7CBD2;

  /* type scale — the only thing the text-size control moves */
  --fs: 1;
  --t-11: calc(11.5px * var(--fs));
  --t-12: calc(12.5px * var(--fs));
  --t-13: calc(13.5px * var(--fs));
  --t-14: calc(14.5px * var(--fs));
  --t-15: calc(15.5px * var(--fs));
  --t-16: calc(16.5px * var(--fs));
  --t-17: calc(17px   * var(--fs));
  --t-19: calc(19px   * var(--fs));
  --t-22: calc(22px   * var(--fs));
  --t-26: calc(26px   * var(--fs));
  --t-30: calc(30px   * var(--fs));
  --t-34: calc(34px   * var(--fs));
  --t-44: calc(44px   * var(--fs));

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 16px;
  --r-xl: 22px;

  --tap: 48px;

  /* the mockup's card treatment: shadow, not border */
  --sh-1: 0 1px 2px rgba(28, 28, 30, .05), 0 3px 10px rgba(28, 28, 30, .05);
  --sh-2: 0 2px 6px rgba(28, 28, 30, .07), 0 8px 20px rgba(28, 28, 30, .07);
  --sh-3: 0 12px 32px rgba(28, 28, 30, .16), 0 2px 8px rgba(28, 28, 30, .06);
  --sh-btn: 0 4px 14px rgba(158, 27, 60, .26);
}

/* --- reset -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: var(--t-17);
  line-height: 1.5;
  color: var(--ink-900);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; border: 0; background: none; }
button { cursor: pointer; border: none; background: none; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--maroon-600); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ==========================================================================
   Stage — the app beside a live system panel
   ========================================================================== */
.stage {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(340px, 400px) 1fr;
  background:
    radial-gradient(120% 80% at 78% 8%, #FBF0F4 0%, rgba(251, 240, 244, 0) 58%),
    radial-gradient(90% 70% at 10% 92%, #EFF1F7 0%, rgba(239, 241, 247, 0) 60%),
    #F4F5F7;
}
.rail {
  padding: 34px 30px 28px 38px;
  display: flex;
  flex-direction: column;
  gap: 26px;
  border-right: 1px solid #E4E6EB;
  background: rgba(255, 255, 255, .62);
  backdrop-filter: blur(6px);
  overflow-y: auto;
  max-height: 100dvh;
}
.rail__brand { display: flex; align-items: center; gap: 12px; }
.rail__mark { flex: none; }
.brand__name { font-size: var(--t-17); font-weight: 700; letter-spacing: -.01em; line-height: 1.1; text-transform: uppercase; }
.brand__sub { font-size: var(--t-12); color: var(--ink-500); margin-top: 3px; line-height: 1.35; }

.rail__block { display: flex; flex-direction: column; gap: 11px; }
.rail__label { font-size: var(--t-12); font-weight: 600; color: var(--ink-500); letter-spacing: .04em; text-transform: uppercase; }
.demo-tag {
  margin-left: 7px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--maroon-100);
  color: var(--maroon-700);
  font-size: var(--t-11);
  font-weight: 700;
  letter-spacing: .02em;
  text-transform: none;
  white-space: nowrap;
}

.roles { display: flex; gap: 6px; background: var(--chip); padding: 4px; border-radius: 12px; }
.roles button {
  flex: 1;
  min-height: 44px;
  border-radius: 9px;
  font-size: var(--t-13);
  font-weight: 600;
  color: var(--ink-600);
  transition: background .16s ease, color .16s ease;
}
.roles button[aria-selected="true"] { background: var(--paper); color: var(--maroon-700); box-shadow: var(--sh-1); }

.loop { position: relative; display: flex; flex-direction: column; gap: 2px; }
.loop__item { position: relative; display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: center; min-height: 44px; padding: 7px 0; text-align: left; width: 100%; }
.loop__item::before { content: ''; position: absolute; left: 12px; top: 26px; bottom: -4px; width: 2px; background: var(--line); }
.loop__item:last-child::before { display: none; }
.loop__dot {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--paper);
  border: 2px solid #E4E6EB;
  color: var(--ink-400);
  font-size: var(--t-11);
  font-weight: 700;
  z-index: 1;
  transition: all .2s ease;
}
.loop__text { font-size: var(--t-13); color: var(--ink-500); line-height: 1.35; }
.loop__item.is-done .loop__dot { border-color: var(--maroon-200); color: var(--maroon-700); background: var(--blush-50); }
.loop__item.is-done::before { background: var(--maroon-200); }
.loop__item.is-active .loop__dot { background: var(--maroon-700); border-color: var(--maroon-700); color: #fff; box-shadow: 0 0 0 5px var(--maroon-100); }
.loop__item.is-active .loop__text { color: var(--ink-900); font-weight: 600; }

.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.counter {
  background: var(--paper);
  border: 1px solid #E4E6EB;
  border-radius: var(--r-md);
  padding: 11px 13px 12px;
  transition: border-color .3s ease, box-shadow .3s ease, background .3s ease;
}
.counter.is-bumped { border-color: var(--maroon-200); background: var(--blush-50); box-shadow: 0 0 0 4px rgba(158, 27, 60, .07); }
.counter__v { font-size: var(--t-22); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.counter__k { font-size: var(--t-11); color: var(--ink-500); margin-top: 3px; line-height: 1.3; }
.counter.is-bumped .counter__v { color: var(--maroon-700); }

.note { background: var(--paper); border: 1px solid #E4E6EB; border-left: 3px solid var(--maroon-700); border-radius: var(--r-md); padding: 13px 15px 14px; }
.note__eyebrow { font-size: var(--t-11); font-weight: 700; color: var(--maroon-700); letter-spacing: .05em; text-transform: uppercase; }
.note__body { font-size: var(--t-13); color: var(--ink-600); line-height: 1.5; margin-top: 5px; }

.rail__foot { margin-top: auto; padding-top: 10px; display: flex; flex-direction: column; gap: 12px; }
.rail__vision { font-size: var(--t-12); color: var(--ink-400); line-height: 1.5; }
.rail__vision b { color: var(--ink-600); font-weight: 600; }
.ghost-btn {
  min-height: 44px;
  border: 1px solid #E4E6EB;
  border-radius: var(--r-sm);
  background: var(--paper);
  font-size: var(--t-13);
  font-weight: 600;
  color: var(--ink-600);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: background .15s ease, border-color .15s ease;
}
.ghost-btn:hover { background: var(--blush-50); border-color: var(--maroon-200); color: var(--maroon-700); }

/* --- phone -------------------------------------------------------------- */
.stage__phone-area { display: grid; place-items: center; padding: 30px 24px; min-height: 100dvh; }
.phone {
  width: 404px;
  max-width: 100%;
  height: min(872px, calc(100dvh - 60px));
  background: linear-gradient(168deg, #2B2E36 0%, #14161B 42%, #23262D 100%);
  border-radius: 52px;
  padding: 11px;
  box-shadow: var(--sh-3), inset 0 0 0 1.5px rgba(255, 255, 255, .14);
  position: relative;
  flex: none;
}
.phone::after {
  content: '';
  position: absolute;
  top: 122px; left: -2px;
  width: 3px; height: 62px;
  border-radius: 2px 0 0 2px;
  background: #3A3E47;
  box-shadow: 0 -78px 0 #3A3E47, 0 84px 0 #3A3E47;
}
.phone__screen {
  width: 100%; height: 100%;
  background: var(--paper);
  border-radius: 42px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.statusbar {
  flex: none;
  height: 44px;
  padding: 0 26px 0 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--t-13);
  font-weight: 600;
  background: var(--paper);
  position: relative;
  z-index: 20;
}
.statusbar__notch {
  position: absolute;
  top: 9px; left: 50%;
  transform: translateX(-50%);
  width: 108px; height: 30px;
  background: #14161B;
  border-radius: 16px;
}
.statusbar__right { display: flex; align-items: center; gap: 5px; }
.statusbar__right svg { color: var(--ink-900); }

.app { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.appbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 12px 10px;
  background: var(--paper);
  min-height: 52px;
  position: relative;
  z-index: 15;
}
.appbar__title {
  font-size: var(--t-19);
  font-weight: 700;
  letter-spacing: -.02em;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.appbar__title--c { text-align: center; }
.appbar__btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--ink-800);
  flex: none;
  position: relative;
  transition: background .15s ease;
}
.appbar__btn:hover { background: var(--line-soft); }
.appbar__btn--back { margin-left: -6px; }
.appbar__dot {
  position: absolute;
  top: 6px; right: 6px;
  min-width: 15px; height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--crit-500);
  color: #fff;
  font-size: var(--t-11);
  font-weight: 700;
  display: grid; place-items: center;
  border: 2px solid var(--paper);
}

/* the mockup's brand header, home screen only */
.brandbar { display: flex; align-items: flex-start; gap: 11px; padding: 0 16px; width: 100%; }
.brandbar__text { flex: 1; min-width: 0; padding-top: 1px; }
.brandbar__name {
  font-size: var(--t-17);
  font-weight: 800;
  line-height: 1.06;
  letter-spacing: -.01em;
  text-transform: uppercase;
}
.brandbar__tag { font-size: var(--t-12); color: var(--ink-500); margin-top: 4px; }

.view {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--canvas);
  scrollbar-width: thin;
  overscroll-behavior: contain;
}
.view::-webkit-scrollbar { width: 8px; }
.view::-webkit-scrollbar-thumb { background: #D8D8DC; border-radius: 4px; border: 2px solid var(--canvas); }
.pad { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.pad--top { padding-top: 6px; }

/* tab bar — icon over label, maroon when current */
.tabbar {
  flex: none;
  display: grid;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 7px 2px 22px;
}
.tabbar button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 5px 2px;
  min-height: var(--tap);
  color: var(--ink-300);
  font-size: var(--t-11);
  font-weight: 500;
  border-radius: 10px;
  transition: color .15s ease;
  position: relative;
}
.tabbar button[aria-current="page"] { color: var(--maroon-700); font-weight: 600; }
.tabbar__badge {
  position: absolute;
  top: 0; left: 50%;
  margin-left: 4px;
  min-width: 15px; height: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: var(--crit-500);
  color: #fff;
  font-size: var(--t-11);
  font-weight: 700;
  display: grid; place-items: center;
  border: 2px solid var(--paper);
}

/* ==========================================================================
   Components
   ========================================================================== */
.card { background: var(--paper); border-radius: var(--r-lg); box-shadow: var(--sh-1); overflow: hidden; }
.card--pad { padding: 16px; }
.card--flat { box-shadow: none; border: 1px solid var(--line); }

/* greeting stack: small grey line, large heading, grey support line */
.greet { padding: 14px 16px 15px; }
.greet__hi { font-size: var(--t-16); color: var(--ink-500); }
.greet__h { font-size: var(--t-30); font-weight: 700; letter-spacing: -.03em; line-height: 1.12; margin-top: 5px; }
.greet__s { font-size: var(--t-16); color: var(--ink-500); margin-top: 7px; line-height: 1.4; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.section-head h2 { font-size: var(--t-19); font-weight: 700; letter-spacing: -.02em; }
.section-head p { font-size: var(--t-13); color: var(--ink-500); }

/* buttons */
.btn {
  min-height: 52px;
  padding: 0 20px;
  border-radius: var(--r-md);
  font-size: var(--t-17);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: background .15s ease, transform .08s ease;
}
.btn:active { transform: scale(.985); }
.btn--primary { background: var(--maroon-700); color: #fff; box-shadow: var(--sh-btn); }
.btn--primary:hover { background: var(--maroon-600); }
.btn--ghost { background: var(--paper); color: var(--ink-800); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn--ghost:hover { background: var(--line-soft); }
.btn--soft { background: var(--blush-50); color: var(--maroon-700); box-shadow: inset 0 0 0 1.5px var(--maroon-100); }
.btn--soft:hover { background: var(--maroon-100); }
.btn--good { background: var(--good-500); color: #fff; }
.btn--danger { background: var(--crit-500); color: #fff; }
.btn--block { width: 100%; }
.btn--sm { min-height: 44px; padding: 0 15px; font-size: var(--t-14); }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* chips — light grey pills */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 32px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: var(--t-14);
  font-weight: 500;
  background: var(--chip);
  color: var(--ink-700);
  white-space: nowrap;
}
.chip--good { background: var(--good-100); color: var(--good-700); font-weight: 600; }
.chip--verified { background: var(--paper); color: var(--good-700); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--good-500); }
.chip--warn { background: var(--warn-100); color: var(--warn-700); font-weight: 600; }
.chip--crit { background: var(--crit-100); color: var(--crit-700); font-weight: 600; }
.chip--info { background: var(--info-100); color: var(--info-700); font-weight: 600; }
.chip--brand { background: var(--blush-100); color: var(--maroon-700); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* rows */
.row {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: var(--tap);
  padding: 13px 16px;
  text-align: left;
  transition: background .15s ease;
}
.row + .row { box-shadow: inset 0 1px 0 var(--line-soft); }
.row:hover { background: var(--blush-50); }
.row__ic { width: 34px; height: 34px; display: grid; place-items: center; flex: none; color: var(--ink-800); }
.row__ic--brand { color: var(--maroon-700); }
.row__ic--good { color: var(--good-500); }
.row__ic--warn { color: var(--warn-500); }
.row__ic--crit { color: var(--crit-500); }
.row__ic--info { color: var(--info-500); }
/* these are spans, so they must be told to stack */
.row__b { flex: 1; min-width: 0; display: block; }
.row__t { display: block; font-size: var(--t-16); font-weight: 500; line-height: 1.3; }
.row__t--strong { font-weight: 600; }
.row__s { display: block; font-size: var(--t-14); color: var(--ink-500); line-height: 1.4; margin-top: 3px; }
.row__chev { color: var(--ink-300); flex: none; }

/* avatars */
.av {
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  font-weight: 600;
  color: #fff;
  background: var(--maroon-700);
  overflow: hidden;
  letter-spacing: -.01em;
}
.av--40 { width: 40px; height: 40px; font-size: var(--t-14); }
.av--48 { width: 48px; height: 48px; font-size: var(--t-17); }
.av--56 { width: 56px; height: 56px; font-size: var(--t-19); }
.av--72 { width: 72px; height: 72px; font-size: var(--t-26); }
.av--150 { width: 150px; height: 150px; font-size: var(--t-44); }
.av--g1 { background: linear-gradient(150deg, #9E1B3C, #C93A60); }
.av--g2 { background: linear-gradient(150deg, #1D5FA8, #4E8ED6); }
.av--g3 { background: linear-gradient(150deg, #1B7A46, #35A96A); }
.av--g4 { background: linear-gradient(150deg, #8A5A06, #C08F1E); }
.av--g5 { background: linear-gradient(150deg, #4B3A8F, #8271CE); }
.av--g6 { background: linear-gradient(150deg, #96221A, #C4544A); }
.av-wrap { position: relative; flex: none; display: inline-block; }
.av-wrap__badge {
  position: absolute;
  right: 5px; bottom: 5px;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--good-500);
  border: 3px solid var(--paper);
  display: grid; place-items: center;
  color: #fff;
}
.av-wrap__badge--sm { width: 24px; height: 24px; right: -1px; bottom: -1px; font-size: 0; }

/* --- hero card — the mockup's centrepiece ------------------------------- */
.hero-card { background: var(--paper); border-radius: var(--r-xl); box-shadow: var(--sh-2); overflow: hidden; position: relative; }
.hero-card__media { position: relative; height: 232px; }
/* no photography available, so the panel carries a monogram instead of a face */
.media {
  width: 100%; height: 100%;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 700;
  letter-spacing: -.02em;
  font-size: var(--t-44);
  position: relative;
  overflow: hidden;
}
.media::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 90% at 78% 10%, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 55%),
    linear-gradient(180deg, rgba(0, 0, 0, 0) 46%, rgba(0, 0, 0, .18) 100%);
}
.media::before {
  content: '';
  position: absolute;
  width: 158px; height: 158px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .13);
}
.media__mono { position: relative; z-index: 1; opacity: .96; }
.media__badge {
  position: absolute;
  left: 16px; bottom: 14px;
  z-index: 2;
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, .95);
  color: var(--good-700);
  font-size: var(--t-13);
  font-weight: 600;
  border-radius: 999px;
  padding: 6px 12px;
}
.fav {
  position: absolute;
  top: 14px; right: 14px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .96);
  color: var(--maroon-700);
  display: grid; place-items: center;
  box-shadow: 0 2px 8px rgba(28, 28, 30, .16);
  z-index: 2;
  transition: background .15s ease, color .15s ease;
}
.fav[aria-pressed="true"] { background: var(--maroon-700); color: #fff; }
.hero-card__body { padding: 15px 16px 16px; }
.hero-card__top { display: flex; align-items: center; gap: 10px; }
.hero-card__name { font-size: var(--t-22); font-weight: 700; letter-spacing: -.02em; flex: 1; min-width: 0; }
.hero-card__meta { display: flex; align-items: center; gap: 6px; font-size: var(--t-15); color: var(--ink-500); margin-top: 7px; }
.hero-card__chips { margin-top: 13px; }
.hero-card__rule { height: 1px; background: var(--line-soft); margin: 15px 0 0; }
.hero-card__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 0 15px; }
.hero-card__when { display: flex; align-items: center; gap: 8px; font-size: var(--t-16); color: var(--ink-700); }
.hero-card__worth { text-align: right; font-size: var(--t-13); color: var(--ink-500); }
.hero-card__worth b { display: block; font-size: var(--t-19); color: var(--maroon-700); font-weight: 700; letter-spacing: -.02em; }

/* pagination dots */
.dots { display: flex; gap: 4px; align-items: center; justify-content: center; }
.dots i { display: block; width: 8px; height: 8px; border-radius: 50%; background: #D6D6DA; transition: all .25s ease; }
.dots i.on { background: var(--maroon-700); width: 22px; border-radius: 4px; }
.media__tap { position: absolute; inset: 0; z-index: 1; border: 0; background: none; }
.fav[aria-pressed="true"] svg { fill: currentColor; }

/* --- centred detail header ---------------------------------------------- */
.dhead { display: flex; align-items: center; width: 100%; gap: 4px; }
.dhead__title {
  flex: 1;
  text-align: center;
  font-size: var(--t-19);
  font-weight: 700;
  letter-spacing: -.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* --- centred profile block ---------------------------------------------- */
.phero { display: flex; flex-direction: column; align-items: center; text-align: center; }
.phero__name { font-size: var(--t-30); font-weight: 700; letter-spacing: -.03em; margin-top: 18px; line-height: 1.15; }
.phero__chips { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; margin-top: 13px; }
.phero__meta { display: flex; align-items: center; gap: 6px; font-size: var(--t-15); color: var(--ink-500); margin-top: 13px; }

/* --- blush value card --------------------------------------------------- */
.worth { background: var(--blush-100); border-radius: var(--r-md); padding: 15px 16px; display: flex; align-items: center; gap: 15px; }
.worth__ic { color: var(--maroon-700); flex: none; }
/* these are spans: without display:block they run together on one line */
.worth__k { display: block; font-size: var(--t-14); color: var(--ink-600); }
.worth__v { display: block; font-size: var(--t-30); font-weight: 700; letter-spacing: -.03em; color: var(--maroon-700); line-height: 1.1; margin-top: 1px; }
.worth__s { display: block; font-size: var(--t-13); color: var(--ink-600); margin-top: 3px; }

/* --- confirmation banner ------------------------------------------------ */
.banner-ok { background: var(--banner); border-radius: var(--r-md); padding: 14px 16px; display: flex; align-items: center; gap: 13px; }
.banner-ok__ic { width: 34px; height: 34px; border-radius: 50%; background: var(--good-500); color: #fff; display: grid; place-items: center; flex: none; }
.banner-ok__t { display: block; font-size: var(--t-16); font-weight: 600; }
.banner-ok__s { display: block; font-size: var(--t-14); color: var(--ink-500); margin-top: 2px; }

/* --- map block ---------------------------------------------------------- */
.map { position: relative; height: 158px; border-radius: var(--r-md); overflow: hidden; background: #EDF0F2; }
.map__open {
  position: absolute;
  right: 12px; bottom: 12px;
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 44px;
  padding: 0 15px;
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink-900);
  font-size: var(--t-14);
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(28, 28, 30, .18);
}
.map__open:hover { background: var(--line-soft); }

/* --- checklist rows ----------------------------------------------------- */
.checkrow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 6px 2px; text-align: left; }
.checkrow__ic { flex: none; color: var(--good-500); }
.checkrow__box {
  width: 26px; height: 26px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px #D2D2D6;
  display: grid; place-items: center;
  color: transparent;
  flex: none;
  margin-left: auto;
  transition: all .15s ease;
}
.checkrow[aria-pressed="true"] .checkrow__box { background: var(--good-500); box-shadow: none; color: #fff; }

.helper { font-size: var(--t-13); color: var(--ink-500); text-align: center; line-height: 1.45; padding: 0 10px; }

/* ==========================================================================
   Remaining components
   ========================================================================== */
.callout { border-radius: var(--r-md); padding: 14px 15px; font-size: var(--t-15); line-height: 1.55; }
.callout--key { background: var(--blush-50); border-left: 3px solid var(--maroon-700); color: var(--ink-800); }
.callout--warn { background: var(--warn-50); border-left: 3px solid var(--warn-500); color: var(--warn-700); }
.callout--crit { background: var(--crit-50); border-left: 3px solid var(--crit-500); color: var(--crit-700); }
.callout__t { font-size: var(--t-12); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }

.course__cover { height: 92px; display: flex; align-items: flex-end; padding: 12px 15px; color: #fff; position: relative; overflow: hidden; }
.course__cover::after { content: ''; position: absolute; right: -30px; top: -46px; width: 132px; height: 132px; border-radius: 50%; background: rgba(255, 255, 255, .11); }
.course__cover svg { position: absolute; right: 14px; bottom: 12px; opacity: .95; }
.cv-1 { background: linear-gradient(135deg, #9E1B3C, #C4405F); }
.cv-2 { background: linear-gradient(135deg, #17518F, #3E82CF); }
.cv-3 { background: linear-gradient(135deg, #1B7A46, #2A9C63); }
.cv-4 { background: linear-gradient(135deg, #8A5A06, #BE8F1C); }
.cv-5 { background: linear-gradient(135deg, #4B3A8F, #7A66C9); }
.course__body { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 9px; }
.course__t { font-size: var(--t-16); font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.course__by { font-size: var(--t-14); color: var(--ink-500); }
.course__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.course__meta { font-size: var(--t-12); color: var(--ink-400); display: flex; align-items: center; gap: 6px; }

.lesson-body { font-size: var(--t-16); color: var(--ink-800); line-height: 1.62; display: flex; flex-direction: column; gap: 13px; }
.lesson-body strong { font-weight: 600; color: var(--ink-900); }

.opt {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; text-align: left;
  padding: 14px 15px;
  border-radius: var(--r-md);
  background: var(--paper);
  box-shadow: inset 0 0 0 1.5px var(--line);
  min-height: var(--tap);
  font-size: var(--t-15);
  line-height: 1.45;
  transition: box-shadow .15s ease, background .15s ease;
}
.opt:hover { background: var(--blush-50); }
.opt__k {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--chip); color: var(--ink-600);
  display: grid; place-items: center;
  font-size: var(--t-13); font-weight: 700; flex: none;
}
.opt.is-correct { box-shadow: inset 0 0 0 2px var(--good-500); background: var(--good-50); }
.opt.is-correct .opt__k { background: var(--good-500); color: #fff; }
.opt.is-wrong { box-shadow: inset 0 0 0 2px var(--crit-500); background: var(--crit-50); }
.opt.is-wrong .opt__k { background: var(--crit-500); color: #fff; }
.opt[disabled] { cursor: default; }

.cert { background: var(--paper); border-radius: var(--r-md); padding: 22px 18px 20px; text-align: center; border: 2.5px solid var(--maroon-100); position: relative; overflow: hidden; }
.cert::before, .cert::after { content: ''; position: absolute; width: 64px; height: 64px; border: 2px solid var(--maroon-100); border-radius: 50%; }
.cert::before { top: -34px; left: -34px; }
.cert::after { bottom: -34px; right: -34px; }
.cert__eyebrow { font-size: var(--t-12); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--maroon-700); }
.cert__name { font-size: var(--t-26); font-weight: 700; letter-spacing: -.02em; margin: 9px 0 5px; line-height: 1.15; }
.cert__course { font-size: var(--t-16); font-weight: 600; color: var(--ink-800); line-height: 1.4; }
.cert__rule { height: 1px; background: var(--line); margin: 17px 0 0; }
.cert__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; margin-top: 14px; }
.cert__k { font-size: var(--t-12); color: var(--ink-500); }
.cert__v { font-size: var(--t-14); font-weight: 600; margin-top: 3px; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field__label { font-size: var(--t-16); font-weight: 600; }
.field__hint { font-size: var(--t-14); color: var(--ink-500); line-height: 1.45; }
.input {
  display: block;
  min-height: var(--tap);
  border-radius: var(--r-md);
  background: var(--paper);
  box-shadow: inset 0 0 0 1.5px var(--line);
  padding: 0 15px;
  font-size: var(--t-19);
  font-weight: 600;
  width: 100%;
  transition: box-shadow .15s ease;
}
textarea.input { line-height: 1.5; }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--maroon-600); }
.input--num { text-align: center; font-variant-numeric: tabular-nums; }

.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 10px; align-items: center; }
.stepper button {
  height: var(--tap);
  border-radius: var(--r-md);
  background: var(--blush-50);
  color: var(--maroon-700);
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1.5px var(--maroon-100);
}
.stepper button:hover { background: var(--maroon-100); }

.opt-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.opt-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.pick {
  min-height: var(--tap);
  border-radius: var(--r-md);
  background: var(--paper);
  box-shadow: inset 0 0 0 1.5px var(--line);
  font-size: var(--t-15);
  font-weight: 600;
  color: var(--ink-600);
  display: flex; align-items: center; justify-content: center;
  gap: 7px; padding: 8px 10px; text-align: center;
  transition: all .15s ease;
}
.pick:hover { background: var(--blush-50); }
.pick[aria-pressed="true"] { background: var(--blush-50); box-shadow: inset 0 0 0 2px var(--maroon-700); color: var(--maroon-700); }
.pick[aria-pressed="true"].is-good { background: var(--good-50); box-shadow: inset 0 0 0 2px var(--good-500); color: var(--good-700); }
.pick[aria-pressed="true"].is-warn { background: var(--warn-50); box-shadow: inset 0 0 0 2px var(--warn-500); color: var(--warn-700); }
.pick[aria-pressed="true"].is-crit { background: var(--crit-50); box-shadow: inset 0 0 0 2px var(--crit-500); color: var(--crit-700); }

.triage { border-radius: var(--r-lg); padding: 17px 16px 18px; color: #fff; }
.triage--good { background: linear-gradient(140deg, var(--triage-good-a), var(--triage-good-b)); }
.triage--warn { background: linear-gradient(140deg, var(--triage-warn-a), var(--triage-warn-b)); }
.triage--crit { background: linear-gradient(140deg, var(--triage-crit-a), var(--triage-crit-b)); }
.triage__ic { width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: grid; place-items: center; margin-bottom: 11px; }
.triage__t { font-size: var(--t-26); font-weight: 700; letter-spacing: -.02em; }
.triage__s { font-size: var(--t-15); opacity: .95; margin-top: 6px; line-height: 1.5; }
.triage__list { margin-top: 13px; display: flex; flex-direction: column; gap: 7px; }
.triage__list li { display: flex; gap: 8px; align-items: flex-start; font-size: var(--t-14); background: rgba(255, 255, 255, .14); border-radius: 10px; padding: 9px 11px; line-height: 1.45; }

.vitals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.vital { background: var(--paper); border-radius: var(--r-md); padding: 13px 11px 14px; text-align: center; box-shadow: var(--sh-1); }
.vital b { display: block; font-size: var(--t-19); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.vital span { font-size: var(--t-12); color: var(--ink-500); display: block; margin-top: 3px; }
.vital--warn b { color: var(--warn-700); }
.vital--crit b { color: var(--crit-700); }
.vital--good b { color: var(--good-700); }

.act__date { width: 52px; flex: none; border-radius: var(--r-sm); background: var(--blush-50); color: var(--maroon-700); text-align: center; padding: 7px 0 8px; }
.act__date b { display: block; font-size: var(--t-19); font-weight: 700; line-height: 1.1; }
.act__date span { font-size: var(--t-11); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.act__stack { display: flex; }
.act__stack .av { margin-left: -10px; box-shadow: 0 0 0 2px var(--paper); }
.act__stack .av:first-child { margin-left: 0; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--paper); border-radius: var(--r-md); padding: 13px 14px 14px; box-shadow: var(--sh-1); }
.tile__k { font-size: var(--t-13); color: var(--ink-500); line-height: 1.3; }
.tile__v { font-size: var(--t-26); font-weight: 700; letter-spacing: -.02em; margin-top: 5px; line-height: 1.1; }
.tile__d { font-size: var(--t-12); margin-top: 5px; display: flex; align-items: center; gap: 4px; color: var(--ink-400); }
.tile__d--up { color: var(--good-700); }
.tile__d--down { color: var(--crit-700); }

.meter { height: 10px; border-radius: 5px; background: var(--maroon-100); overflow: hidden; }
.meter__f { height: 100%; background: var(--maroon-700); border-radius: 5px; }
.meter--good { background: var(--good-100); }
.meter--good .meter__f { background: var(--good-500); }

/* charts — one series, brand hue, hairline grid, selective labels */
.chart { padding: 16px; }
.chart__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.chart__t { font-size: var(--t-16); font-weight: 600; letter-spacing: -.01em; }
.chart__s { font-size: var(--t-13); color: var(--ink-500); margin-top: 3px; }
.chart__plot { position: relative; height: 132px; display: flex; align-items: flex-end; }
.chart__grid { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; }
.chart__grid i { height: 1px; background: var(--grid); }
.chart__cols { position: relative; width: 100%; height: 100%; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; gap: 2px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
.col__bar { width: 100%; max-width: 24px; background: var(--maroon-200); border-radius: 4px 4px 0 0; min-height: 3px; }
.col--now .col__bar { background: var(--series-1); }
.col__v { position: absolute; top: -19px; font-size: var(--t-12); font-weight: 700; color: var(--ink-800); font-variant-numeric: tabular-nums; }
.col__x { font-size: var(--t-11); color: var(--ink-400); margin-top: 6px; font-variant-numeric: tabular-nums; }
.chart__axis { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; }
.chart__axis span { font-size: var(--t-11); color: var(--ink-400); text-align: center; }
.chart__toggle { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 0; font-size: var(--t-13); color: var(--ink-500); cursor: pointer; list-style: none; }
.chart__toggle::-webkit-details-marker { display: none; }
.chart__toggle::after {
  content: '';
  width: 7px; height: 7px; margin-left: 2px;
  border-right: 1.6px solid currentColor;
  border-bottom: 1.6px solid currentColor;
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform .2s ease;
}
details[open] .chart__toggle::after { transform: rotate(225deg) translate(-1px, -1px); }

.split { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--chip); gap: 2px; }
.split__a { background: var(--series-1); }
.split__b { background: var(--series-2); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
.legend__i { display: flex; align-items: center; gap: 7px; font-size: var(--t-13); color: var(--ink-600); }
.legend__k { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.legend__k--a { background: var(--series-1); }
.legend__k--b { background: var(--series-2); }

/* hero figure — exactly one per view */
.hero-fig { text-align: center; padding: 22px 16px 20px; }
.hero-fig b { display: block; font-size: var(--t-44); font-weight: 700; letter-spacing: -.035em; line-height: 1; color: var(--maroon-700); }
.hero-fig span { display: block; font-size: var(--t-15); color: var(--ink-600); margin-top: 9px; line-height: 1.45; }
.hero-fig em { display: block; font-size: var(--t-13); color: var(--ink-400); font-style: normal; margin-top: 7px; }

.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-13); margin-top: 12px; }
.tbl th, .tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line-soft); }
.tbl th { color: var(--ink-500); font-weight: 600; }
.tbl td { font-variant-numeric: tabular-nums; }
.tbl td:last-child, .tbl th:last-child { text-align: right; }

.tl { display: flex; flex-direction: column; }
.tl__i { display: grid; grid-template-columns: 26px 1fr; gap: 12px; position: relative; padding-bottom: 15px; }
.tl__i::before { content: ''; position: absolute; left: 12px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.tl__i:last-child { padding-bottom: 0; }
.tl__i:last-child::before { display: none; }
.tl__dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; z-index: 1; }
.tl__dot--good { background: var(--good-100); color: var(--good-700); }
.tl__dot--warn { background: var(--warn-100); color: var(--warn-700); }
.tl__dot--crit { background: var(--crit-100); color: var(--crit-700); }
.tl__dot--brand { background: var(--maroon-100); color: var(--maroon-700); }
.tl__t { display: block; font-size: var(--t-15); font-weight: 600; line-height: 1.35; padding-top: 3px; }
.tl__s { display: block; font-size: var(--t-13); color: var(--ink-500); margin-top: 3px; line-height: 1.45; }

.scrim { position: absolute; inset: 0; background: rgba(28, 28, 30, .42); z-index: 60; display: flex; align-items: flex-end; animation: fade .2s ease; }
.sheet { background: var(--paper); width: 100%; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 10px 16px 22px; max-height: 88%; overflow-y: auto; animation: rise .26s cubic-bezier(.2, .8, .3, 1); }
.sheet__grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
.sheet__t { font-size: var(--t-19); font-weight: 700; letter-spacing: -.02em; margin-bottom: 5px; }
.sheet__s { font-size: var(--t-14); color: var(--ink-500); margin-bottom: 15px; line-height: 1.5; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(100%); } }

.toast {
  position: absolute;
  left: 14px; right: 14px;
  bottom: 92px;
  background: var(--ink-900);
  color: #fff;
  border-radius: var(--r-md);
  padding: 13px 15px;
  font-size: var(--t-14);
  font-weight: 500;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  z-index: 80;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seedState();
    const parsed = JSON.parse(raw);
    const base = seedState();
    // merge so a schema change never breaks a stored session
    return { ...base, ...parsed, counters: { ...base.counters, ...(parsed.counters || {}) } };
  } catch (e) {
    return seedState();
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode */ }
}
function resetDemo() {
  S = seedState();
  save();
  draft = null;
  bump = null;
  go('#/home');
  render();
  toast('Demo reset to its starting state.', 'refresh');
}

let draft = null;

function newDraft(seniorId) {
  const s = senior(seniorId);
  const last = s.history[0];
  return {
    seniorId,
    step: 0,
    sys: last ? last.sys : 130,
    dia: last ? last.dia : 80,
    pulse: last ? last.pulse : 74,
    mood: '', appetite: '', sleep: '',
    meds: '', dizzy: '', fallen: '', homeSafe: '',
    note: '',
  };
}

/* Thresholds mirror the academy content and are the clinic's, not the mentor's. */
function triage(d) {
  const flags = [];
  let level = 'good';
  const up = l => { if (l === 'crit') level = 'crit'; else if (level !== 'crit') level = 'warn'; };

  if (d.sys >= 180 || d.dia >= 120) { flags.push(['Blood pressure at emergency level', 'crit']); up('crit'); }
  else if (d.sys >= 160 || d.dia >= 100) { flags.push(['Blood pressure well above target', 'crit']); up('crit'); }
  else if (d.sys >= 140 || d.dia >= 90) { flags.push(['Blood pressure above target', 'warn']); up('warn'); }
  if (d.sys < 90 || d.dia < 60) { flags.push(['Blood pressure unusually low', 'warn']); up('warn'); }
  if (d.pulse > 110 || d.pulse < 50) { flags.push(['Pulse outside the usual range', 'warn']); up('warn'); }
  if (d.dizzy === 'yes') { flags.push(['Dizzy on standing — fall risk', 'crit']); up('crit'); }
  if (d.fallen === 'yes') { flags.push(['A fall since the last visit', 'crit']); up('crit'); }
  if (d.meds === 'no') { flags.push(['Medication not taken', 'warn']); up('warn'); }
  else if (d.meds === 'partly') { flags.push(['Medication taken irregularly', 'warn']); up('warn'); }
  if (d.mood === 'low') { flags.push(['Low mood reported', 'warn']); up('warn'); }
  if (d.appetite === 'poor') { flags.push(['Eating poorly', 'warn']); up('warn'); }
  if (d.homeSafe === 'no') { flags.push(['Home safety concern', 'warn']); up('warn'); }
  if (d.note && /chest pain|can\'t breathe|cannot breathe|fell|bleeding|unconscious|weak(ness)? on one side/i.test(d.note)) {
    flags.push(['Your note mentions something urgent', 'crit']); up('crit');
  }
  return { level, flags };
}

        : `<button class="btn btn--primary btn--block" data-act="next-lesson" data-id="${c.id}" data-i="${i}">
            Next lesson ${ic('arrow-right', 18, 2.2)}</button>`}
    </div>
    ${isCert ? `<p class="muted center" style="font-size:var(--t-12)">You are already certified in this module. Reading it again never removes the certificate.</p>` : ''}
  </div>`;
};

/* ---- mentor: quiz ------------------------------------------------------ */
V.quiz = ({ a: id }) => {
  const c = course(id);
  if (!c) return V.train();
  const q = S.quiz[c.id] || { picked: [], passed: false };
  // questions can be answered in any order, so count real answers, not array slots
  const answered = q.picked.filter(p => p !== undefined).length;
  const score = q.picked.filter((p, i) => p === c.quiz[i].a).length;
  const allDone = answered === c.quiz.length;
  const need = Math.ceil(c.quiz.length * 2 / 3);

  return `
  <div class="pad">
    <div class="card card--pad">
      <div class="row__t">${esc(c.title)}</div>
      <div class="row__s">${allDone
        ? `You scored ${score} of ${c.quiz.length}. ${score >= need ? 'That is a pass.' : `You need ${need} to pass.`}`
        : `${answered} of ${c.quiz.length} answered · ${need} correct needed to pass`}</div>
    </div>

    ${c.quiz.map((item, qi) => {
      const picked = q.picked[qi];
      const done = picked !== undefined;
      return `
      <div class="card card--pad">
        <div class="row-between" style="align-items:flex-start;margin-bottom:12px">
          <div class="row__t" style="flex:1">${qi + 1}. ${esc(item.q)}</div>
        </div>
        <div class="stack stack--sm">
          ${item.options.map((o, k) => {
            let cls = '';
            if (done) cls = k === item.a ? 'is-correct' : (k === picked ? 'is-wrong' : '');
            return `<button class="opt ${cls}" ${done ? 'disabled' : ''}
              data-act="answer" data-id="${c.id}" data-q="${qi}" data-k="${k}">
              <span class="opt__k">${done && k === item.a ? ic('check', 14, 3) : done && k === picked ? ic('x', 14, 3) : String.fromCharCode(65 + k)}</span>
              <span>${esc(o)}</span>
            </button>`;
          }).join('')}
        </div>
        ${done ? `<div class="callout ${picked === item.a ? 'callout--key' : 'callout--warn'}" style="margin-top:12px">
          <div class="callout__t">${picked === item.a ? ic('check-circle', 14, 2.2) + 'Correct' : ic('alert', 14, 2.2) + 'Not quite'}</div>
          ${esc(item.why)}</div>` : ''}
      </div>`;
    }).join('')}

    ${allDone ? (score >= need
      ? `<button class="btn btn--good btn--block" data-act="certify" data-id="${c.id}">
          ${ic('award', 19, 2.1)} Issue my certificate</button>`
      : `<button class="btn btn--primary btn--block" data-act="retake" data-id="${c.id}">
          ${ic('refresh', 18, 2.1)} Try the quiz again</button>`)
      : `<p class="muted center" style="font-size:var(--t-13)">Answer every question to finish.</p>`}
  </div>`;
};

/* ---- mentor: certificate ----------------------------------------------- */
V.certificate = ({ a: id }) => {

  const m = DATA.mentor;

      <div class="cert__course">${esc(c.title)}</div>

        <div><div class="cert__k">Issued by</div><div class="cert__v">${esc(c.by)}</div></div>
        <div><div class="cert__k">Date</div><div class="cert__v">${dateStr}</div></div>
        <div><div class="cert__k">Mentor ID</div><div class="cert__v tnum">${esc(m.mentorId)}</div></div>
        <div><div class="cert__k">Valid until</div><div class="cert__v">September 2028</div></div>
      </div>
    </div>

    <div class="callout callout--key">
      <div class="callout__t">${ic('shield', 14, 2.2)}What this certifies</div>
      Nurse Anong has confirmed you can ${esc(c.outcome.charAt(0).toLowerCase() + c.outcome.slice(1))} It does not authorise you to diagnose, to advise on medication, or to act in an emergency beyond calling for help.
    </div>

    <div class="stack stack--sm">
      <button class="btn btn--primary btn--block" data-act="save-cert" data-id="${c.id}">
        ${ic('check', 18, 2.4)} Save to my profile</button>

  </div>`;
};

/* ---- mentor: circle ---------------------------------------------------- */

      <div class="stack">
        ${others.map(s => `

            <div style="flex:1;min-width:0">

          <div class="stack stack--sm" style="margin-top:13px">
            <button class="btn btn--soft btn--block" data-act="offer" data-id="${s.id}">
              ${ic('users', 18, 2.1)} Offer to support ${esc(s.name.split(' ').slice(-1)[0])}</button>

      <div class="stack">
        ${DATA.activities.map(a => {

          return `
          <div class="card card--pad">
            <div class="act" style="padding:0">
              <span class="act__date"><b>${esc(a.day.split(' ')[0].slice(0, 3))}</b><span>${esc(a.time.split(' ')[0])}</span></span>
              <span style="flex:1;min-width:0">
                <span class="row__t">${esc(a.title)}</span>

            <div class="row-between" style="margin-top:13px">

            <div class="stack stack--sm" style="margin-top:12px">

                   <button class="btn btn--ghost btn--block" data-act="leave" data-id="${a.id}">Leave group</button>`
                : `<button class="btn btn--soft btn--block" data-act="join" data-id="${a.id}">${ic('plus', 18, 2.3)} Join this group</button>`}

/* ---- mentor: senior detail --------------------------------------------- */
V.senior = ({ a: id }) => {
  const s = senior(id);
  if (!s) return V.circle({});
  const mine = S.circle.includes(s.id);
  const myChecks = S.checkins.filter(c => c.seniorId === s.id);
  const hist = [...myChecks.map(c => ({
    d: c.date, sys: c.sys, dia: c.dia, pulse: c.pulse, tone: c.level, note: c.note || 'No note left.',
  })), ...s.history];
  const cases = S.cases.filter(c => c.seniorId === s.id);

  const NEED_ICON = { 'Blood pressure check': 'pulse', 'Medication reminders': 'pill', 'Company': 'chat', 'Walking companion': 'walk', 'Grocery help': 'cart', 'Conversation': 'chat', 'Post-fall check-ins': 'shield', 'Home safety help': 'home', 'Social connection': 'users', 'Wellbeing check-ins': 'heart', 'Medication routine': 'pill', 'Newly retired': 'spark' };

  return `
  <div class="pad pad--top">
    <div class="phero">
      ${avWrap(s, 150, mine)}
      <div class="phero__name">${esc(s.name)}, ${s.age}</div>
      <div class="phero__chips">
        ${mine
          ? `<span class="chip chip--verified">${ic('check', 14, 3)}In your circle</span>`
          : `<span class="chip chip--warn">${ic('clock', 14, 2.4)}Not yet assigned</span>`}
        <span class="chip chip--brand">${s.interest}% match</span>
      </div>
      <div class="phero__meta">${ic('map-pin', 17, 2.1)}${esc(s.area)}</div>
    </div>

    ${sectionHead('What they need')}
    <div class="card">
      ${s.needs.map(n => `<div class="row">
        <span class="row__ic">${ic(NEED_ICON[n] || 'check-circle', 22)}</span>
        <span class="row__b"><span class="row__t">${esc(n)}</span></span>
        <span class="row__chev">${ic('chev-right', 20, 2.2)}</span>
      </div>`).join('')}
    </div>

    ${sectionHead('Why you match')}
    <div class="chips">
      ${chip(s.livesAlone ? 'Lives alone' : 'Lives with family', '', 'home')}
      ${s.conditions.map(c => chip(c, '', 'droplet')).join('')}
      ${chip(s.area.split('·')[0].trim(), '', 'map-pin')}
    </div>

    <div class="callout callout--key">
      <div class="callout__t">${ic('info', 14, 2.2)}Notes from the health centre</div>
      ${esc(s.notes)}
    </div>

    <div class="worth">
      <span class="worth__ic">${ic('wallet', 36, 1.9)}</span>
      <span>
        <span class="worth__k">This visit is worth</span>
        <span class="worth__v">฿340</span>
        <span class="worth__s">of professional time</span>
      </span>
    </div>

    ${mine ? `<button class="btn btn--primary btn--block" data-act="nav" data-to="#/checkin/${s.id}">
      ${ic('clipboard', 20, 2.1)} Log a check-in</button>`
    : `<button class="btn btn--primary btn--block" data-act="offer" data-id="${s.id}">
      ${ic('users', 20, 2.1)} Offer to support ${esc(s.name.split(' ').slice(-1)[0])}</button>`}

    <div class="stack stack--sm">
      <button class="btn btn--ghost btn--block" data-act="call" data-id="${s.id}">
        ${ic('phone', 19, 2.1)} Call ${esc(s.name)}</button>
    </div>

    ${cases.length ? `
    ${sectionHead('Raised to the nurse')}
    <div class="stack stack--sm">
      ${cases.map(c => `
      <div class="card card--pad" style="border-left:3px solid var(--${c.status === 'open' ? (c.severity === 'crit' ? 'crit-500' : 'warn-500') : 'good-500'})">
        <div class="row-between">
          <span class="chip chip--${c.status === 'open' ? c.severity : 'good'}">
            ${ic(c.status === 'open' ? 'alert' : 'check', 12, 2.6)}${c.status === 'open' ? 'With the nurse' : 'Answered'}</span>
          <span class="row__s" style="margin:0">${esc(c.raised)}</span>
        </div>
        <div class="row__t" style="margin-top:9px;font-size:var(--t-14)">${esc(c.reason)}</div>
        ${c.action ? `<div class="callout callout--key" style="margin-top:11px">
          <div class="callout__t">${ic('stethoscope', 14, 2.2)}Nurse Anong</div>${esc(c.action)}</div>`
          : `<div class="row__s" style="margin-top:6px">Waiting for the nurse to review.</div>`}
      </div>`).join('')}
    </div>` : ''}

    ${sectionHead('Visit history', hist.length ? `${hist.length} recorded` : '')}
    ${hist.length ? `<div class="card card--pad"><div class="tl">
      ${hist.map(v => `
      <div class="tl__i">
        <span class="tl__dot tl__dot--${v.tone === 'good' ? 'good' : v.tone === 'warn' ? 'warn' : 'crit'}">
          ${ic(v.tone === 'good' ? 'check' : 'alert', 15, 2.6)}</span>
        <span>
          <span class="tl__t">${esc(v.d)} · ${v.sys}/${v.dia} · pulse ${v.pulse}</span>
          <span class="tl__s">${esc(v.note)}</span>
        </span>
      </div>`).join('')}
    </div></div>` : `<div class="card"><div class="empty">
      <div class="empty__ic">${ic('clipboard', 26)}</div>
      <div class="empty__t">No visits recorded yet</div>
      <div class="empty__s">Your first check-in will start the history for ${esc(s.name)}. A single reading says little — a trend is what the nurse needs.</div>
    </div></div>`}
  </div>`;
};

/* ---- mentor: check-in form --------------------------------------------- */
V.checkin = ({ a: id }) => {
  if (!draft || draft.seniorId !== id) draft = newDraft(id);
  const s = senior(id);
  const d = draft;
  const steps = ['Vital signs', 'Wellbeing', 'Medication & safety', 'Notes'];
  const pct = ((d.step + 1) / steps.length) * 100;

  const yn = (field, opts) => `
    <div class="opt-${opts.length === 2 ? '2' : '3'}">
      ${opts.map(o => `<button class="pick ${o.tone ? 'is-' + o.tone : ''}" aria-pressed="${d[field] === o.v}"
        data-act="ci-set" data-field="${field}" data-value="${o.v}">${esc(o.label)}</button>`).join('')}
    </div>`;

  let body = '';
  if (d.step === 0) {
    body = `
      <div class="card card--pad">
        <div class="field" style="margin-bottom:18px">
          <div class="field__label">Systolic — the top number</div>
          <div class="stepper">
            <button data-act="ci-bp" data-field="sys" data-op="-1" aria-label="Lower systolic">${ic('chev-down', 20, 2.4)}</button>
            <input class="input input--num" type="number" inputmode="numeric" value="${d.sys}" readonly aria-label="Systolic">
            <button data-act="ci-bp" data-field="sys" data-op="1" aria-label="Raise systolic">${ic('chev-right', 20, 2.4)}</button>
          </div>
        </div>
        <div class="field" style="margin-bottom:18px">
          <div class="field__label">Diastolic — the bottom number</div>
          <div class="stepper">
            <button data-act="ci-bp" data-field="dia" data-op="-1" aria-label="Lower diastolic">${ic('chev-down', 20, 2.4)}</button>
            <input class="input input--num" type="number" inputmode="numeric" value="${d.dia}" readonly aria-label="Diastolic">
            <button data-act="ci-bp" data-field="dia" data-op="1" aria-label="Raise diastolic">${ic('chev-right', 20, 2.4)}</button>
          </div>
        </div>
        <div class="field">
          <div class="field__label">Pulse, beats per minute</div>
          <div class="stepper">
            <button data-act="ci-bp" data-field="pulse" data-op="-1" aria-label="Lower pulse">${ic('chev-down', 20, 2.4)}</button>
            <input class="input input--num" type="number" inputmode="numeric" value="${d.pulse}" readonly aria-label="Pulse">
            <button data-act="ci-bp" data-field="pulse" data-op="1" aria-label="Raise pulse">${ic('chev-right', 20, 2.4)}</button>
          </div>
        </div>
      </div>
      <div class="callout callout--key">
        <div class="callout__t">${ic('info', 14, 2.2)}Before you record</div>
        Both feet flat, back supported, arm resting at heart level on a bare arm. Five minutes of quiet rest first, and no talking during the reading.
      </div>`;
  } else if (d.step === 1) {
    body = `
      <div class="card card--pad stack" style="gap:20px">
        <div class="field">
          <div class="field__label">How has their mood been?</div>
          <div class="field__hint">Ask openly. "How have the mornings been?" works better than "Are you okay?"</div>
          ${yn('mood', [{ v: 'good', label: 'Bright', tone: 'good' }, { v: 'flat', label: 'Flat' }, { v: 'low', label: 'Low', tone: 'warn' }])}
        </div>
        <div class="field">
          <div class="field__label">Appetite and eating</div>
          ${yn('appetite', [{ v: 'good', label: 'Eating well', tone: 'good' }, { v: 'fair', label: 'Fair' }, { v: 'poor', label: 'Poor', tone: 'warn' }])}
        </div>
        <div class="field">
          <div class="field__label">Sleep</div>
          ${yn('sleep', [{ v: 'good', label: 'Sleeping well', tone: 'good' }, { v: 'broken', label: 'Broken' }, { v: 'poor', label: 'Barely sleeping', tone: 'warn' }])}
        </div>
      </div>`;
  } else if (d.step === 2) {
    body = `
      <div class="card card--pad stack" style="gap:20px">
        <div class="field">
          <div class="field__label">Have they taken their medication as prescribed?</div>
          <div class="field__hint">Check the pill organiser rather than asking. People often say yes to be polite.</div>
          ${yn('meds', [{ v: 'yes', label: 'Yes', tone: 'good' }, { v: 'partly', label: 'Some doses missed', tone: 'warn' }, { v: 'no', label: 'No', tone: 'warn' }])}
        </div>
        <div class="field">
          <div class="field__label">Any dizziness when standing up?</div>
          <div class="field__hint">Ask them to stand and watch. Dizziness on standing is a leading cause of falls.</div>
          ${yn('dizzy', [{ v: 'no', label: 'No', tone: 'good' }, { v: 'yes', label: 'Yes', tone: 'crit' }])}
        </div>
        <div class="field">
          <div class="field__label">Has there been a fall since your last visit?</div>
          ${yn('fallen', [{ v: 'no', label: 'No', tone: 'good' }, { v: 'yes', label: 'Yes', tone: 'crit' }])}
        </div>
        <div class="field">
          <div class="field__label">Does the home look safe to walk through?</div>
          <div class="field__hint">Loose rugs, cables across a path, the route to the toilet at night.</div>
          ${yn('homeSafe', [{ v: 'yes', label: 'Yes', tone: 'good' }, { v: 'no', label: 'No — hazards', tone: 'warn' }])}
        </div>
      </div>`;
  } else {
    const t = triage(d);
    body = `
      <div class="card card--pad">
        <div class="field">
          <div class="field__label">Anything else you noticed?</div>
          <div class="field__hint">Write what you saw and what they said. Do not write what you think it means — the nurse will decide that.</div>
          <textarea class="input" rows="4" style="padding:13px 15px;height:auto;font-weight:400;resize:vertical"
            data-act="ci-note" placeholder="e.g. Said the tablets make her dizzy in the morning. Ate only rice at lunch.">${esc(d.note)}</textarea>
        </div>
      </div>
      <div class="card card--pad">
        <div class="row__t" style="margin-bottom:12px">Summary</div>
        <div class="vitals">
          <div class="vital ${d.sys >= 160 || d.dia >= 100 ? 'vital--crit' : d.sys >= 140 || d.dia >= 90 ? 'vital--warn' : 'vital--good'}">
            <b>${d.sys}/${d.dia}</b><span>blood pressure</span></div>
          <div class="vital"><b>${d.pulse}</b><span>pulse</span></div>
          <div class="vital ${t.level === 'good' ? 'vital--good' : t.level === 'warn' ? 'vital--warn' : 'vital--crit'}">
            <b>${t.flags.length}</b><span>flag${t.flags.length === 1 ? '' : 's'}</span></div>
        </div>
        ${t.flags.length ? `<div class="chips" style="margin-top:13px">
          ${t.flags.map(f => chip(f[0], f[1] === 'crit' ? 'crit' : 'warn', 'alert')).join('')}</div>`
          : `<div class="callout callout--key" style="margin-top:13px">
              <div class="callout__t">${ic('check-circle', 14, 2.2)}Nothing flagged</div>
              This visit sits inside the clinic's normal range. It will be filed as a routine check-in.</div>`}
      </div>`;
  }

  return `
  <div class="pad">
    <div class="card card--pad" style="display:flex;gap:12px;align-items:center;padding:13px 15px">
      ${av(s, 48)}
      <div style="flex:1;min-width:0">
        <div class="row__t">${esc(s.name)}, ${s.age}</div>
        <div class="row__s">${esc(s.area)}</div>
      </div>
    </div>

    <div>
      <div class="row-between" style="margin-bottom:7px">
        <span class="row__s" style="margin:0">Step ${d.step + 1} of ${steps.length} · ${esc(steps[d.step])}</span>
        <span class="row__s" style="margin:0">${Math.round(pct)}%</span>
      </div>
      <div class="bar"><span class="bar__f" style="width:${pct}%"></span></div>
    </div>

    ${body}

    <div class="stack stack--sm">
      ${d.step === steps.length - 1
        ? `<button class="btn btn--primary btn--block" data-act="submit-checkin">${ic('check', 19, 2.4)} Save check-in</button>`
        : `<button class="btn btn--primary btn--block" data-act="ci-next">Continue ${ic('arrow-right', 18, 2.2)}</button>`}
      ${d.step > 0 ? `<button class="btn btn--ghost btn--block" data-act="ci-prev">${ic('chev-left', 18, 2.2)} Back</button>` : ''}
    </div>
  </div>`;
};

/* ---- mentor: check-in result ------------------------------------------- */
V.result = ({ a: id }) => {
  const rec = S.checkins.filter(c => c.seniorId === id).slice(-1)[0];
  if (!rec) return V.circle({});
  const s = senior(id);
  const tone = rec.level;
  const head = tone === 'good' ? 'All within range'
    : tone === 'warn' ? 'Worth watching' : 'Needs a nurse today';
  const sub = tone === 'good'
    ? `Filed as a routine check-in. Next visit in seven days.`
    : tone === 'warn'
      ? `Recorded and sent to Nurse Anong for review. Nothing needs to happen tonight.`
      : `Nurse Anong has been alerted. She will decide what happens next.`;

  return `
  <div class="pad">
    <div class="triage triage--${tone}">
      <div class="triage__ic">${ic(tone === 'good' ? 'check' : 'alert', 26, 2.4)}</div>
      <div class="triage__t">${esc(head)}</div>
      <div class="triage__s">${esc(sub)}</div>
      ${rec.flags.length ? `<ul class="triage__list">
        ${rec.flags.map(f => `<li>${ic('alert', 15, 2.4)}<span>${esc(f[0])}</span></li>`).join('')}
      </ul>` : ''}
    </div>

    <div class="card card--pad" style="display:flex;gap:13px;align-items:center">
      ${av(s, 48)}
      <div style="flex:1;min-width:0">
        <div class="row__t">${esc(s.name)}, ${s.age}</div>
        <div class="row__s">Checked at ${esc(rec.time)} · ${esc(rec.date)}</div>
      </div>
    </div>

    <div class="vitals">
      <div class="vital ${rec.sys >= 160 ? 'vital--crit' : rec.sys >= 140 ? 'vital--warn' : 'vital--good'}">
        <b>${rec.sys}/${rec.dia}</b><span>blood pressure</span></div>
      <div class="vital"><b>${rec.pulse}</b><span>pulse</span></div>
      <div class="vital"><b>${rec.flags.length}</b><span>flags raised</span></div>
    </div>

    ${rec.note ? `<div class="card card--pad">
      <div class="row__s" style="margin:0 0 6px">Your note</div>
      <div style="font-size:var(--t-14);line-height:1.55">${esc(rec.note)}</div>
    </div>` : ''}

    ${tone !== 'good' && !rec.escalated ? `
      <button class="btn btn--danger btn--block" data-act="escalate" data-id="${rec.id}">
        ${ic('send', 18, 2.2)} Send this to Nurse Anong</button>` : ''}

    ${rec.escalated ? `
      <div class="callout callout--key">
        <div class="callout__t">${ic('check-circle', 14, 2.2)}Sent to Nurse Anong</div>
        She has it in her inbox now. You will be told what she decides. You do not need to do anything else.
      </div>
      <button class="btn btn--ghost btn--block" data-act="switch-role" data-role="nurse">
        ${ic('eye', 18, 2.1)} See it arrive in the nurse's inbox</button>` : ''}

    <div class="stack stack--sm">
      <button class="btn btn--ghost btn--block" data-act="nav" data-to="#/senior/${s.id}">View ${esc(s.name)}'s history</button>
      <button class="btn btn--ghost btn--block" data-act="nav" data-to="#/home">Back to home</button>
    </div>

    ${tone === 'good' ? `<div class="callout callout--key">
      <div class="callout__t">${ic('trend', 14, 2.2)}Why this matters</div>
      A routine visit that finds nothing is not wasted. It is the record that shows the nurse which neighbours are stable — so the ones that are not get her attention faster.
    </div>` : ''}
  </div>`;
};

/* ---- mentor: activity detail ------------------------------------------- */
V.activity = ({ a: id }) => {
  const a = activity(id);
  if (!a) return V.circle({});
  const joined = S.joined.includes(a.id);
  const doneSessions = S.sessions.filter(x => x.activityId === a.id && x.completed);
  const group = a.attendees.map(senior).filter(Boolean);

  return `
  <div class="pad">
    <div class="card course">
      <div class="course__cover ${a.kind === 'Exercise' ? 'cv-4' : a.kind === 'Social' ? 'cv-3' : 'cv-2'}">
        ${ic(a.icon, 34, 1.7)}
        <span class="course__t" style="color:#fff;font-size:var(--t-19);max-width:76%">${esc(a.title)}</span>
      </div>
      <div class="course__body">
        <div class="chip-row chips">
          ${chip(a.kind)}${chip(a.day)}${chip(a.time)}
        </div>
        <div class="course__meta" style="margin-top:2px">${ic('map-pin', 13, 2.2)}${esc(a.place)}</div>
        <div class="course__meta">${ic('user', 13, 2.2)}Led by ${esc(a.lead)}</div>
      </div>
    </div>

    <div class="callout callout--key">
      <div class="callout__t">${ic('info', 14, 2.2)}About this group</div>
      ${esc(a.note)}
    </div>

    ${joined ? `<div class="callout callout--warn">
      <div class="callout__t">${ic('alert', 14, 2.2)}Before you lead</div>
      Count heads at the start, at the halfway point and at the end. Put someone at the back so nobody walks alone.
    </div>` : ''}

    ${sectionHead('Who comes', `${group.length} regular${group.length === 1 ? '' : 's'}`)}
    <div class="card">
      ${group.map(s => row({
        title: `${esc(s.name)}, ${s.age}`,
        sub: esc(s.needs[0]),
        chev: true, act: 'nav', data: `data-to="#/senior/${s.id}"`,
        icon: 'user',
      })).join('')}
    </div>

    ${doneSessions.length ? `
    ${sectionHead('Sessions you have led', `${doneSessions.length}`)}
    <div class="card card--pad"><div class="tl">
      ${doneSessions.map(s => `
      <div class="tl__i">
        <span class="tl__dot tl__dot--good">${ic('check', 15, 2.6)}</span>
        <span><span class="tl__t">${esc(s.date)} · ${esc(s.time)}</span>
        <span class="tl__s">${s.present.length} attended · ${s.hours} mentor hour${s.hours === 1 ? '' : 's'} logged</span></span>
      </div>`).join('')}
    </div></div>` : ''}

    <div class="stack stack--sm">
      ${joined
        ? `<button class="btn btn--primary btn--block" data-act="nav" data-to="#/session/${a.id}">
            ${ic('play', 17, 2.1)} Start today's session</button>
           <button class="btn btn--ghost btn--block" data-act="leave" data-id="${a.id}">
            ${ic('x', 18, 2.2)} Leave this group</button>`
        : `<button class="btn btn--soft btn--block" data-act="join" data-id="${a.id}">
            ${ic('plus', 18, 2.3)} Join this group</button>`}
      <button class="btn btn--ghost btn--block" data-act="nav" data-to="#/circle/act">
        All activities</button>
    </div>
  </div>`;
};

/* ---- mentor: activity session ------------------------------------------ */
V.session = ({ a: id }) => {
  const a = activity(id);
  if (!a) return V.circle({});
  // a session exists as soon as anyone is ticked off; only completing it counts
  const s = S.sessions.filter(x => x.activityId === a.id).slice(-1)[0];
  const done = !!(s && s.completed);
  const present = s ? s.present : a.attendees;
  const group = a.attendees.map(senior).filter(Boolean);
  return `
  <div class="pad pad--top">
    <div class="banner-ok">
      <span class="banner-ok__ic">${ic('check', 19, 3)}</span>
      <span>
        <span class="banner-ok__t">${done ? 'Session completed' : 'Attendance open'}</span>
        <span class="banner-ok__s">${done
          ? `Logged at ${esc(s.time)} · ${s.present.length} attended`
          : 'Tick everyone off as they arrive'}</span>
      </span>
    </div>

    <div class="card">
      <div class="row">
        <span class="row__ic row__ic--brand">${ic('calendar', 22)}</span>
        <span class="row__b"><span class="row__t">${esc(a.day)}</span></span>
      </div>
      <div class="row">
        <span class="row__ic row__ic--brand">${ic('clock', 22)}</span>
        <span class="row__b"><span class="row__t">${esc(a.time)}</span></span>
      </div>
      <div class="row">
        <span class="row__ic row__ic--brand">${ic('hourglass', 22)}</span>
        <span class="row__b"><span class="row__t">1 hour</span></span>
      </div>
    </div>

    <button class="card" data-act="nav" data-to="#/circle/act" style="text-align:left;width:100%">
      <span class="row" style="padding:0">
        <span style="padding:14px 0 14px 16px;display:flex">${av(a.attendees[0] ? senior(a.attendees[0]) : DATA.mentor, 48)}</span>
        <span class="row__b" style="padding:14px 16px 14px 0">
          <span class="row__t row__t--strong">${esc(a.title)}</span>
          <span class="row__s">${esc(a.place)}</span>
        </span>
        <span class="row__chev" style="padding-right:16px">${ic('chev-right', 20, 2.2)}</span>
      </span>
    </button>

    <div class="map">
      ${mapFig()}
      <button class="map__open" data-act="map">${ic('compass', 18, 2.1)} Open in Maps</button>
    </div>

    ${sectionHead('Attendance', `${present.length} of ${a.attendees.length} present`)}
    <div class="card">
      ${a.attendees.map(sid => {
        const p = senior(sid);
        if (!p) return '';
        const on = present.includes(sid);
        return `
        <button class="checkrow" style="padding:11px 16px" aria-pressed="${on}" data-act="toggle-att" data-id="${a.id}" data-sid="${sid}">
          ${av(p, 40)}
          <span class="row__b">
            <span class="row__t row__t--strong">${esc(p.name)}, ${p.age}</span>
            <span class="row__s">${on ? 'Present' : 'Not here yet'}</span>
          </span>
          <span class="checkrow__box">${ic('check', 16, 3.4)}</span>
        </button>`;
      }).join('')}
    </div>

    ${sectionHead('Before you go')}
    <div>
      ${[
        ['bag', 'Bring water and a phone'],
        ['users', 'Someone sweeps at the back'],
        ['shield', 'Nearest clinic noted'],
      ].map(([icon, label]) => `
      <div class="checkrow">
        <span class="checkrow__ic">${ic(icon, 24, 2)}</span>
        <span class="row__b"><span class="row__t">${esc(label)}</span></span>
        <span class="checkrow__box">${ic('check', 16, 3.4)}</span>
      </div>`).join('')}
    </div>

    ${done ? `<div class="callout callout--key">
      <div class="callout__t">${ic('check-circle', 14, 2.2)}On your record</div>
      ${s.hours} mentor hour${s.hours === 1 ? '' : 's'} added. ${s.present.length} of ${a.attendees.length} attended.
    </div>` : `
    <button class="btn btn--primary btn--block" data-act="complete-session" data-id="${a.id}">
      ${ic('play', 20, 2.2)} Complete session</button>`}

    <p class="helper">Count heads at the start, at the halfway point and at the end. Nobody walks alone at the back.</p>
  </div>`;
};

/* ---- mentor: impact ---------------------------------------------------- */
V.impact = () => {
  const w = S.hours.weeks;
  // axis top is a multiple of three so every tick is a whole number
  const axisMax = Math.max(3, Math.ceil((Math.max(...w, 1) * 1.15) / 3) * 3);
  const total = w.reduce((a, b) => a + b, 0);
  const escalated = S.cases.filter(c => c.raisedByMentor).length;
  const handled = Math.max(0, S.checkins.length - escalated);
  const splitTotal = Math.max(1, handled + escalated);

  return `
  <div class="pad">
    <div class="card">
      <div class="hero-fig">
        <b class="tnum">${num(Math.round(S.counters.hours))}</b>
        <span>professional hours freed across ${esc(DATA.district.name)}</span>
        <em>since the network began in March 2026</em>
      </div>
    </div>

    <div class="tiles">
      <div class="tile">
        <div class="tile__k">Trained mentors</div>
        <div class="tile__v tnum">${num(S.counters.mentors)}</div>
        <div class="tile__d tile__d--up">${ic('trend', 12, 2.4)}+12 this month</div>
      </div>
      <div class="tile">
        <div class="tile__k">Check-ins logged</div>
        <div class="tile__v tnum">${num(S.counters.checkins)}</div>
        <div class="tile__d tile__d--up">${ic('trend', 12, 2.4)}+248 this month</div>
      </div>
      <div class="tile">
        <div class="tile__k">Early flags raised</div>
        <div class="tile__v tnum">${num(S.counters.flags)}</div>
        <div class="tile__d">caught before a clinic visit</div>
      </div>
      <div class="tile">
        <div class="tile__k">Mentor hours given</div>
        <div class="tile__v tnum">${num(Math.round(DATA.district.checkins * 0.4))}</div>
        <div class="tile__d">by volunteers, unpaid</div>
      </div>
    </div>

    <div class="card chart">
      <div class="chart__head">
        <div>
          <div class="chart__t">Your mentoring hours</div>
          <div class="chart__s">Last 8 weeks · ${oneDp(total)} hours in total</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:24px 1fr;gap:8px">
        <div style="display:flex;flex-direction:column;justify-content:space-between;height:132px;font-size:var(--t-11);color:var(--ink-400);text-align:right;font-variant-numeric:tabular-nums">
          <span>${axisMax}</span><span>${axisMax * 2 / 3}</span><span>${axisMax / 3}</span><span>0</span>
        </div>
        <div>
          <div class="chart__plot">
            <div class="chart__grid"><i></i><i></i><i></i><i></i></div>
            <div class="chart__cols">
              ${w.map((v, i) => `
              <div class="col ${i === w.length - 1 ? 'col--now' : ''}">
                ${i === w.length - 1 ? `<span class="col__v">${oneDp(v)}</span>` : ''}
                <span class="col__bar" style="height:${(v / axisMax) * 100}%"></span>
              </div>`).join('')}
            </div>
          </div>
          <div class="chart__axis">
            ${w.map((_, i) => `<span>W${i + 1}</span>`).join('')}
          </div>
        </div>
      </div>
      <details style="margin-top:6px">
        <summary class="chart__toggle">View as a table</summary>
        <table class="tbl">
          <caption class="sr">Mentoring hours by week</caption>
          <thead><tr><th scope="col">Week</th><th scope="col">Hours</th></tr></thead>
          <tbody>${w.map((v, i) => `<tr><td>Week ${i + 1}</td><td>${oneDp(v)}</td></tr>`).join('')}</tbody>
        </table>
      </details>
    </div>

    <div class="card card--pad">
      <div class="chart__t">Where the flags went</div>
      <div class="chart__s" style="margin-bottom:13px">Every flag you raise is triaged by a nurse. Most never need her to leave her desk.</div>
      <div class="split">
        <span class="split__a" style="flex:${handled || 0.001}"></span>
        <span class="split__b" style="flex:${escalated || 0.001}"></span>
      </div>
      <div class="legend">
        <span class="legend__i"><i class="legend__k legend__k--a"></i>Handled by a mentor (${handled})</span>
        <span class="legend__i"><i class="legend__k legend__k--b"></i>Escalated to a nurse (${escalated})</span>
      </div>
      ${S.checkins.length === 0 ? `<div class="row__s" style="margin-top:12px">Log a check-in and this chart fills in with your own numbers.</div>` : ''}
    </div>

    <div class="card card--pad">
      <div class="row__t" style="margin-bottom:11px">What one flag can change</div>
      <div class="tl">
        <div class="tl__i"><span class="tl__dot tl__dot--brand">${ic('eye', 15, 2.4)}</span>
          <span><span class="tl__t">A neighbour notices</span>
          <span class="tl__s">A dizzy spell on standing, mentioned in passing over tea. Not a reason to book an appointment.</span></span></div>
        <div class="tl__i"><span class="tl__dot tl__dot--warn">${ic('clipboard', 15, 2.4)}</span>
          <span><span class="tl__t">It becomes a record</span>
          <span class="tl__s">Three of those over five weeks is a pattern. The app keeps the pattern, not just the moment.</span></span></div>

        <div class="tl__i"><span class="tl__dot tl__dot--good">${ic('check', 15, 2.6)}</span>
          <span><span class="tl__t">A fall does not happen</span>
          <span class="tl__s">The hip is never broken, the hospital bed is never used, and the independence is never lost.</span></span></div>
      </div>
    </div>
  </div>`;
};

          <div class="row__s">${esc(c.reason)}</div>
